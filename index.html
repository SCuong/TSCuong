<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LocalKit — Local-first developer, document &amp; media tools</title>
    <meta
      name="description"
      content="Over 100 developer, PDF, image, data and text tools that run entirely in your browser. Files never leave your device."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Resolve the theme before first paint to avoid a light/dark flash.
      (function () {
        var theme = 'dark';
        try {
          var pref = localStorage.getItem('localkit:theme');
          if (pref === 'light' || pref === 'dark') theme = pref;
          else theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f7f9' : '#0b0e14');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem">
        LocalKit runs its tools locally in your browser and needs JavaScript to be enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
